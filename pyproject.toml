[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroloop"
version = "0.1.0.dev0"
description = "Physics-based flight-control experiments and recorded replay"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
aeroloop = "aeroloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
