name: CPU checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/aeroloop check-lock
      - run: python tools/check_evidence.py
      - run: python tools/check_public.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python tools/aeroloop test --suite cpu
      - run: node --test web/viewer.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/replay/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web/replay
      - run: npm test
        working-directory: web/replay
      - name: Prepare measured browser evidence
        run: |
          python tools/aeroloop simulate --scenario hover --output runs/browser
          python tools/aeroloop simulate --scenario position-step --output runs/browser
          python tools/aeroloop simulate --scenario lateral-force-pulse --output runs/browser
          python tools/replay_demo.py runs/browser/cpu-hover-* runs/browser/cpu-position-step-* runs/browser/cpu-lateral-force-pulse-*
      - run: npx playwright install --with-deps chromium
        working-directory: web/replay
      - run: npm run test:browser
        working-directory: web/replay
      - run: npm run demo:build
        working-directory: web/replay
